<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Foundation — Зворотній зв'язок</title>
    <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico" />
          </head>
  <body>
    <div class="loader-screen">
      <div class="loader"></div>
    </div>
    <header class="header">
      <div class="container header__nav-wrap">
        <a class="brand" href="index.html">
          <img src="images/logo.webp" alt="logo" class="brand-logo" />
          <span class="brand-text">Future Foundation</span>
        </a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-label="Відкрити меню"
        >
          <span></span><span></span><span></span>
        </button>
        <nav class="navigation">
          <ul class="nav__list">
            <li><a href="index.html">Головна</a></li>
            <li class="nav__item--dropdown">
              <a href="about.html">Про нас</a>
              <ul class="nav__submenu">
                <li><a href="about.html">Про нас</a></li>
                <li><a href="campaigns.html">Збори</a></li>
                <li><a href="cases.html">Кейси</a></li>
                <li><a href="posts.html">Новини</a></li>
              </ul>
            </li>
            <li><a href="reports.html">Звіти</a></li>
            <li><a href="partners.html">Партнери</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="feedback.html">Зворотній зв'язок</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero hero-dark centered">
        <div class="container">
          <h1 class="hero__title">Зворотній зв'язок</h1>
          <p>Залиште ваш коментар з питанням чи пропозицією</p>
          <button class="scroll-down__btn" id="scroll-down">
            <img
              src="images/icons/arrow-down.png"
              class="scroll-down__icon"
              alt="scroll down"
            />
          </button>
        </div>
      </section>
      <section class="comments">
        <div class="container">
          <div class="section__head">
            <p class="label">Думи мої, думи мої</p>
            <h2>Коментарі та пропозиції</h2>
          </div>

          <form class="card feedback-comment-form" id="comment-form">
            <label for="comment-name">Ім'я</label>
            <input
              id="comment-name"
              name="name"
              type="text"
              maxlength="80"
              required
              placeholder="Ваше ім'я"
            />
            <label for="comment-email">Email (опціонально)</label>
            <input
              id="comment-email"
              name="email"
              type="email"
              maxlength="120"
              placeholder="you@example.com"
            />
            <button class="btn btn--secondary comment-auth-btn" id="comment-auth-btn" type="button">
              Верифікувати профіль, щоб залишити коментар
            </button>
            <p class="comment-auth-status" id="comment-auth-status" aria-live="polite"></p>

            <label for="comment-text">Коментар</label>
            <textarea
              id="comment-text"
              name="content"
              rows="5"
              maxlength="1500"
              required
              placeholder="Напишіть ваш відгук або пропозицію"
            ></textarea>
            <label for="comment-file">Завантажити файл (зображення/GIF, до 2MB)</label>
            <input
              id="comment-file"
              name="mediaFile"
              type="file"
              accept="image/png,image/jpeg,image/webp,image/gif"
            />
            <p class="comment-file-status" id="comment-file-status" aria-live="polite"></p>
            <div id="comment-media-preview" class="comment-media-preview" aria-live="polite"></div>

            <button class="btn btn--primary" type="submit">
              Надіслати коментар
            </button>
            <p
              class="comment-form-status"
              id="comment-form-status"
              aria-live="polite"
            ></p>
          </form>

          <div class="comment-list" id="comment-list" aria-live="polite"></div>
          <div class="comment-more-wrap">
            <button class="btn btn--secondary" id="comment-load-more-btn" type="button">Завантажити ще</button>
          </div>
        </div>
      </section>
    </main>
          </body>
</html>
