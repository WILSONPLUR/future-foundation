<!doctype html>
<html lang="uk-UA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Адмін-панель — Future Foundation</title>
    <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico" />
          </head>
  <body>
<a href="#main" class="skip-link">Skip to content</a>
    <main id="main" class="admin-wrap">
      <section class="admin-card">
        <h1>Вхід в адмін-панель</h1>
        <p class="admin-note">Тільки для ролей admin/editor</p>
        <form class="admin-form" id="admin-login-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="160" autocomplete="username" required placeholder="admin@example.com" />

          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required placeholder="••••••••" />

          <button class="btn btn--primary" type="submit">Увійти</button>
          <p id="admin-login-status" class="admin-note"></p>
        </form>
      </section>
    </main>
      </body>
</html>
